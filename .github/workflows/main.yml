name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build plugin
        run: gradle build --no-daemon

      - name: Zip resource pack
        run: |
          cd resourcepack
          zip -r ../GunPack.zip .
          cd ..
          sha1sum GunPack.zip | tee GunPack.sha1

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: GunsPlugin-jar
          path: build/libs/*.jar

      # Завантажений з Actions архів сам і є ресурс паком (assets і pack.mcmeta в корені).
      # Його можна класти в .minecraft/resourcepacks одразу, без розпаковки.
      - name: Upload resource pack (ready to use)
        uses: actions/upload-artifact@v4
        with:
          name: GunPack
          path: resourcepack/

      - name: Upload resource pack zip + sha1 (for hosting)
        uses: actions/upload-artifact@v4
        with:
          name: GunPack-hosting
          path: |
            GunPack.zip
            GunPack.sha1

      - name: Release (only for tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            GunPack.zip
            GunPack.sha1
