# Скільки патронів видається разом зі зброєю
give-amount: 64

revolver:
  damage: 10.0          # шкода за постріл (10 HP = пів шкали здоров'я гравця)
  cooldown-ticks: 12    # пауза між пострілами (20 тіків = 1 сек)
  magazine: 6           # місткість барабана
  reload-ticks: 50      # час перезарядки
  range: 60.0           # дальність пострілу

shotgun:
  damage-per-shell: 270.0   # шкода одного патрона впритул (2 патрони = 540, варден має 500 HP)
  shells-per-shot: 2        # скільки патронів витрачається за постріл
  magazine: 2               # місткість обріза
  cooldown-ticks: 25
  reload-ticks: 40
  spread-degrees: 2.0       # розкид кожного патрона
  full-damage-range: 5.0    # до цієї відстані шкода повна
  max-range: 25.0           # далі цієї відстані куля не летить
  min-damage-multiplier: 0.2  # множник шкоди на максимальній відстані
